name: Build Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify Recipes
        shell: bash
        run: |
          echo "检查构建产物中的配方..."

          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "错误：找不到 JAR"
            exit 1
          fi

          echo "JAR: $JAR"

          echo "配方文件："
          jar tf "$JAR" | grep "data/kaleidoscope_snack/recipes/" || {
            echo "错误：JAR 中没有找到配方！"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaleidoscope_snack
          path: build/libs/*.jar
          if-no-files-found: error